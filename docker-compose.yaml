services:
  database:
    image: "postgres:16-alpine"
    container_name: "fiap-soat-database"
    restart: "unless-stopped"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DATABASE_NAME:-fiap}
      TZ: America/Fortaleza
    volumes:
      - fiap_soat_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DATABASE_NAME:-fiap}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplica as migrações do Prisma e o seed de demonstração (idempotente) e termina.
  migrate:
    build:
      context: .
      target: migrate
    container_name: "fiap-soat-migrate"
    depends_on:
      database:
        condition: service_healthy
    # Variáveis explícitas (lidas do `.env` por interpolação): a DATABASE_URL aponta para o serviço `database`.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@database:5432/${POSTGRES_DATABASE_NAME:-fiap}
      SEED_PASSWORD: ${SEED_PASSWORD:?Defina SEED_PASSWORD no .env}
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    container_name: "fiap-soat-api"
    restart: "unless-stopped"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@database:5432/${POSTGRES_DATABASE_NAME:-fiap}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env (mínimo 32 caracteres)}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      TRACKING_TOKEN_EXPIRES_IN: ${TRACKING_TOKEN_EXPIRES_IN:-7d}
      TRACKING_BASE_URL: ${TRACKING_BASE_URL:-http://localhost:3001}

volumes:
  fiap_soat_data:
