services:
  database:
    image: "postgres:16-alpine"
    container_name: "fiap-soat-database"
    restart: "unless-stopped"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DATABASE_NAME:-fiap}
      TZ: America/Fortaleza
    volumes:
      - fiap_soat_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DATABASE_NAME:-fiap}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fiap_soat_data:
