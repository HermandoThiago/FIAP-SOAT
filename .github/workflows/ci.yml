name: CI

# Qualidade mínima de todo PR e push em develop/master (ADR-006, ADR-007): build, lint, testes
# unitários com gate de cobertura, testes de integração (PostgreSQL via Testcontainers), imagem Docker
# e varredura de segredos. O título do PR segue Conventional Commits (CLAUDE.md, seção Git).

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.15.1"
  # Valores fictícios, só para o CI (nenhum segredo real).
  JWT_SECRET: ci-only-secret-with-at-least-32-characters-0123456789
  DATABASE_URL: postgresql://admin:admin@localhost:5432/fiap

jobs:
  pr-title:
    name: Título do PR (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validar título
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

  build-lint:
    name: Build e lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile # o postinstall gera o client do Prisma
      - name: Typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.json
      - name: Lint
        run: pnpm run lint
      - name: Build
        run: pnpm run build

  unit-tests:
    name: Testes unitários e cobertura (gate ≥ 80 %)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Testes com cobertura (falha se a meta não for atingida)
        run: pnpm run test:cov
      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  integration-tests:
    name: Testes de integração (PostgreSQL real)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # O runner do GitHub já tem Docker: o Testcontainers sobe o PostgreSQL 16 sozinho.
      - name: Testes de integração
        run: pnpm run test:integration

  docker:
    name: Imagem Docker e docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint do Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
      - name: Build da imagem de produção
        run: docker build --target runtime -t fiap-soat-api:ci .
      - name: Validar o compose
        run: |
          cp .env.example .env
          docker compose config -q
      - name: Subir o ambiente completo (banco, migrações e API)
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' fiap-soat-api)" = healthy ] && break
            sleep 3
          done
          docker inspect -f '{{.State.Health.Status}}' fiap-soat-api | grep -qx healthy
          curl --fail --silent --show-error http://localhost:3001/docs -o /dev/null
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs
      - name: Derrubar
        if: always()
        run: docker compose down -v

  secrets-scan:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico inteiro: o repositório fica público na entrega
      # CLI oficial via imagem (a action exige licença em repositórios de organização).
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --no-banner --redact --verbose

  dependency-audit:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Falha só em vulnerabilidades altas/críticas das dependências de produção.
      - name: pnpm audit
        run: pnpm audit --prod --audit-level high
